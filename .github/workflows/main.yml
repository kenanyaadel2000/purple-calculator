name: Build & Deploy Flutter Web and APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 🌟 این خط جادویی پوشه اندروید رو خودکار میسازه 🌟
      - name: Generate missing platform folders
        run: flutter create . --project-name purple_calculator

      - name: Install dependencies
        run: flutter pub get

      # --- ساخت نسخه وب ---
      - name: Build Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      # --- ساخت نسخه اندروید (APK) ---
      - name: Build APK
        run: flutter build apk --release

      # --- آپلود فایل APK برای دانلود ---
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # --- آپلود فایل‌های وب برای انتشار ---
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
